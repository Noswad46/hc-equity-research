# Coverage universe — hand-maintained. See SPEC.md §4.
#
# Anchor: vaccines and infectious disease, plus a large-cap pharma comparison set
# so the metrics have context.
#
# CIKs were taken from https://www.sec.gov/files/company_tickers.json and are
# zero-padded to 10 digits, as data.sec.gov requires.
#
# `ct_sponsor_names` and `fda_applicant_names` are NOT yet verified against live
# ClinicalTrials.gov / openFDA responses — that happens in M4/M7. SPEC §4 is
# explicit that these must be curated by hand and never fuzzy-matched, so treat
# the values below as first drafts to be confirmed, not as working mappings.
#
# Deliberately excluded from v1: GSK, AstraZeneca, Sanofi and BioNTech. All four
# are foreign private issuers reporting under IFRS, and the exclusion is a
# comparability decision, not only a plumbing one.
#
#   1. Accounting basis. Under IAS 38 development costs that meet the
#      capitalisation criteria are carried on the balance sheet and amortised,
#      while US GAAP expenses essentially all R&D as incurred. R&D intensity and
#      cash runway therefore measure different things on the two bases, and a
#      screener that ranked them side by side would be comparing an expense line
#      against a partly capitalised one. There is no adjustment available from
#      companyfacts that would fix this.
#   2. Reporting frequency. Several of these issuers do not file quarterly with
#      the SEC at all — they file 20-F annually — so the discrete quarterly
#      series this pipeline is built on does not exist for them in companyfacts.
#
# Covering them properly needs an IFRS concept mapping and a separate,
# clearly-labelled comparability treatment. See
# content/methodology/coverage-exclusions.md.

